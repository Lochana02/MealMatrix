services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: cliper-backend
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    volumes:
      - ./Backend:/app
      - /app/node_modules
    command: sh -c "npm install && node index.js"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: cliper-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    env_file:
      - ./Frontend/.env
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - CHOKIDAR_USEPOLLING=true